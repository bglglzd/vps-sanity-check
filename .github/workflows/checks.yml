name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    name: Shell syntax, lint and isolated fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck from the runner distribution
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y shellcheck
      - name: Check actual shell sources and isolated command fixtures
        run: |
          set -euo pipefail
          for file in sanity-check.sh lib/*.sh tests/*.sh; do bash -n "$file"; done
          shellcheck -x sanity-check.sh lib/*.sh tests/*.sh
          bash tests/check-command-failures.sh
          bash tests/check-effective-queries.sh
          git diff --check
  native:
    name: Booted Ubuntu 24.04 VM acceptance
    needs: shell
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install disposable VM tooling on this hosted runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage openssh-client gnupg curl acl
          test -c /dev/kvm
          sudo setfacl -m "u:${USER}:rw" /dev/kvm
      - name: Verify signed image, boot VM, exercise failures and recovery
        run: bash tests/native-vm.sh
      - name: Retain synthetic acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-vm-evidence-${{ github.sha }}
          path: .test-evidence/native-vm/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
